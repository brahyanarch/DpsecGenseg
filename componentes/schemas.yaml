components:
  schemas:
    newUser:
      type: object
      properties:
        username:
          type: string
          description: Nombre de usuario
          example: juan123
        email:
          type: string
          description: Correo electrónico
          format: email
          example: juan@example.com
        password:
          type: string
          description: Contraseña del usuario
          format: password
          example: 12345