          application/json:
            schema:
              $ref: '#/components/schemas/NewQuestion'
      responses:
        '201':
          description: Pregunta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'

  /permissions:
    get:
      summary: Obtener todos los permisos
      responses:
        '200':
          description: Lista de permisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
    post:
      summary: Crear un permiso
      requestBody:
        description: Datos para crear un permiso
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPermission'
      responses:
        '201':
          description: Permiso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'

  /subunits:
    get:
      summary: Obtener todas las subunidades
      responses:
        '200':
          description: Lista de subunidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubUnit'
    post:
      summary: Crear una subunidad
      requestBody:
        description: Datos para crear una subunidad
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubUnit'
      responses:
        '201':
          description: Subunidad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubUnit'

