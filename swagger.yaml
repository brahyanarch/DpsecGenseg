openapi: 3.0.3
info:
  title: Genseg API
  description: API de autenticacion, usuarios y perfiles de Genseg.
  version: 1.0.0

servers:
  - url: http://localhost:3006
    description: Servidor local

tags:
  - name: Auth
    description: Autenticacion y registro de usuarios
  - name: Usuarios
    description: Administracion de usuarios
  - name: Perfiles
    description: Administracion de perfiles de usuario

paths:
  /v1/auth/register:
    post:
      tags:
        - Auth
      summary: Registrar usuario
      description: Crea un usuario vigente y activo con credenciales locales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              cEmail: admin@genseg.com
              cPassword: "12345"
              cNombre: Administrador
      responses:
        '201':
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessWithDataResponse'
              example:
                nSuccess: true
                data:
                  message: Usuario registrado exitosamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesion
      description: Autentica al usuario y devuelve un token. Solo considera usuarios vigentes, activos y perfiles vigentes/activos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              cEmail: admin@genseg.com
              cPassword: "12345"
              idActiveProfile: 1
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/assign-role:
    post:
      tags:
        - Perfiles
      summary: Asignar rol a usuario
      description: Crea un perfil de usuario asociado a un rol y una oficina.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              idUser: 1
              idRol: 2
              idOficina: 3
              dExpiresAt: null
      responses:
        '201':
          description: Rol asignado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                nSuccess: true
                cMessage: Rol asignado correctamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/users/{idUser}/status:
    patch:
      tags:
        - Usuarios
      summary: Activar o desactivar usuario
      description: Cambia `lActivo` del usuario. Es reversible y no elimina el registro.
      parameters:
        - $ref: '#/components/parameters/IdUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
            examples:
              desactivar:
                value:
                  lActivo: false
              activar:
                value:
                  lActivo: true
      responses:
        '200':
          description: Estado actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                nSuccess: true
                cMessage: Estado del usuario actualizado correctamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/users/{idUser}:
    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      description: Soft delete irreversible a nivel de API. Marca el usuario como no vigente, lo desactiva, guarda `dDeletedAt`, cambia su correo para liberar el email original y elimina logicamente sus perfiles.
      parameters:
        - $ref: '#/components/parameters/IdUser'
      responses:
        '200':
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                nSuccess: true
                cMessage: Usuario eliminado correctamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/profiles/{idUsuarioUni}/status:
    patch:
      tags:
        - Perfiles
      summary: Activar o desactivar perfil
      description: Cambia `lActivo` del perfil. Es reversible mientras el perfil siga vigente.
      parameters:
        - $ref: '#/components/parameters/IdUsuarioUni'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
            examples:
              desactivar:
                value:
                  lActivo: false
              activar:
                value:
                  lActivo: true
      responses:
        '200':
          description: Estado del perfil actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                nSuccess: true
                cMessage: Estado del perfil actualizado correctamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

  /v1/auth/profiles/{idUsuarioUni}:
    delete:
      tags:
        - Perfiles
      summary: Eliminar perfil
      description: Soft delete irreversible a nivel de API. Marca el perfil como no vigente y lo desactiva.
      parameters:
        - $ref: '#/components/parameters/IdUsuarioUni'
      responses:
        '200':
          description: Perfil eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                nSuccess: true
                cMessage: Perfil eliminado correctamente
        '401':
          $ref: '#/components/responses/AppError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    IdUser:
      name: idUser
      in: path
      required: true
      description: Identificador del usuario.
      schema:
        type: integer
        minimum: 1
      example: 1

    IdUsuarioUni:
      name: idUsuarioUni
      in: path
      required: true
      description: Identificador del perfil en la tabla `user_rol_oficina_universidad`.
      schema:
        type: integer
        minimum: 1
      example: 1

  responses:
    AppError:
      description: Error controlado por la aplicacion
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            nSuccess: false
            error:
              cCode: "40401"
              cMessage: Usuario no encontrado
              cTechnicalDetails: idUser

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            nSuccess: false
            error:
              cCode: "50000"
              cMessage: Error interno del servidor
              cTechnicalDetails: Unexpected error

  schemas:
    RegisterRequest:
      type: object
      required:
        - cEmail
        - cPassword
        - cNombre
      properties:
        cEmail:
          type: string
          format: email
          example: admin@genseg.com
        cPassword:
          type: string
          minLength: 5
          example: "12345"
        cNombre:
          type: string
          example: Administrador

    LoginRequest:
      type: object
      required:
        - cEmail
        - cPassword
      properties:
        cEmail:
          type: string
          format: email
          example: admin@genseg.com
        cPassword:
          type: string
          example: "12345"
        idActiveProfile:
          type: integer
          nullable: true
          example: 1

    AssignRoleRequest:
      type: object
      required:
        - idUser
        - idRol
        - idOficina
      properties:
        idUser:
          type: integer
          minimum: 1
          example: 1
        idRol:
          type: integer
          minimum: 1
          example: 2
        idOficina:
          type: integer
          minimum: 1
          example: 3
        dExpiresAt:
          type: string
          format: date-time
          nullable: true
          example: null

    UpdateStatusRequest:
      type: object
      required:
        - lActivo
      properties:
        lActivo:
          type: boolean
          description: Estado reversible del usuario o perfil.
          example: true

    Perfil:
      type: object
      properties:
        idProfile:
          type: integer
          example: 1
        idRol:
          type: integer
          example: 2
        cNombreRol:
          type: string
          example: Administrador
        idOficina:
          type: integer
          example: 3
        cNombreOficina:
          type: string
          example: Oficina Central
        dExpiresAt:
          type: string
          format: date-time
          nullable: true
          example: null

    LoginData:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          type: object
          properties:
            email:
              type: string
              format: email
              example: admin@genseg.com
            nombre:
              type: string
              example: Administrador
            perfiles:
              type: array
              items:
                $ref: '#/components/schemas/Perfil'

    LoginSuccessResponse:
      type: object
      properties:
        nSuccess:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/LoginData'

    SuccessWithDataResponse:
      type: object
      properties:
        nSuccess:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true

    MessageResponse:
      type: object
      properties:
        nSuccess:
          type: boolean
          example: true
        cMessage:
          type: string
          example: Operacion realizada correctamente

    ErrorResponse:
      type: object
      properties:
        nSuccess:
          type: boolean
          example: false
        error:
          type: object
          properties:
            cCode:
              type: string
              example: "40001"
            cMessage:
              type: string
              example: INVALID_FIELD
            cTechnicalDetails:
              type: string
              example: lActivo
