openapi: 3.0.0
info:
  title: Genseg API
  description: API para la gestión de proyectos y usuarios en Genseg
  version: 1.0.0
servers:
  - url: https://2nlfx0w1-3000.brs.devtunnels.ms
    description: Servidor de desarrollo

paths:
  /auth/register:
    post:
      summary: Crear un nuevo usuario administrador General
      requestBody:
        description: Datos para crear un usuario
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdmin'
      responses:
        '201':
          description: Usuario creado correctamente
        '400':
          description: Error en la solicitud (Datos invalidos)
        '500':
          description: Error el usuario ya existe
  /auth/login:
    post:
      summary: Con el usuario y su password debe de ingresar para logearse
      requestBody:
        description: Datos para logearse y devolver un token
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdmin'
      responses:
        '201':
          description: Usuario logeado correctamente
        '400':
          description: El usuario y password es obligatorio
        '401':
          description: El usuario no encontrado
        '404':
          description: El usuario y password no coinciden
        '500':
          description: Error el usuario ya existe
          

paths:
  /projects/{id}:
    get:
      summary: Obtener todos los proyectos
      responses:
        '200':
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      summary: Crear un proyecto
      requestBody:
        description: Datos para crear un proyecto
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
      responses:
        '201':
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'

  /permisos:
    get:
      summary: Obtener todos los permisos
      responses:
        '200':
          description: Lista de permisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permiso'
    post:
      summary: Crear un nuevo permiso
      requestBody:
        description: Datos para crear un permiso
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPermiso'
      responses:
        '201':
          description: Permiso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permiso'

  /users:
    get:
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Crear un usuario
      requestBody:
        description: Datos para crear un usuario
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /activities:
    post:
      summary: Crear una actividad
      requestBody:
        description: Datos para crear una actividad
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewActivity'
      responses:
        '201':
          description: Actividad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    put:
      summary: Actualizar una actividad
      requestBody:
        description: Datos para actualizar una actividad
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivity'
      responses:
        '200':
          description: Actividad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    delete:
      summary: Eliminar una actividad
      requestBody:
        description: Datos para eliminar una actividad
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteActivity'
      responses:
        '200':
          description: Actividad eliminada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
    get:
      summary: Obtener el número de estados de actividades
      responses:
        '200':
          description: Número de estados de actividades
          content:
            application/json:
              schema:
                type: integer
                example: 5

  /roles:
    get:
      summary: Obtener todos los roles
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      summary: Crear un rol
      requestBody:
        description: Datos para crear un rol
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRole'
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
