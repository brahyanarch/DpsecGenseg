  /forms:
    get:
      summary: Obtener todos los formularios
      responses:
        '200':
          description: Lista de formularios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Form'
    post:
      summary: Crear un formulario
      requestBody:
        description: Datos para crear un formulario
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewForm'
      responses:
        '201':
          description: Formulario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'

  /questions:
    get:
      summary: Obtener todas las preguntas
      responses:
        '200':
          description: Lista de preguntas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    post:
      summary: Crear una pregunta
      requestBody:
        description: Datos para crear una pregunta
        required: true
